<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prezentacja Interaktywna</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Asap:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
/* Główny arkusz stylów prezentacji CHOPIN */
:root {
    --bg-dark: #0D0D0D; /* Czarny matowy background */
    --bg-card: #171717; /* Eleganckie ciemne karty */
    --accent-cyan: #FE0467; /* Brandowy róż Chopin */
    --accent-pink: #FE0467;
    --accent-red: #ef4444;
    --text-main: #f8fafc;
    --text-muted: #a1a1aa;
    --border-color: rgba(255, 255, 255, 0.08);
    --box-shadow-card: 0 10px 30px rgba(0, 0, 0, 0.6);
    --header-bg: rgba(23, 23, 23, 0.75);
    --controls-bg: rgba(23, 23, 23, 0.88);
    --old-q-color: #71717a;
    --new-q-color: #ffffff;
    --overlay-bg: rgba(13, 13, 13, 0.96);
}

/* Motyw Jasny (Light Theme) */
body.light-theme {
    --bg-dark: #f8fafc;
    --bg-card: #ffffff;
    --text-main: #0f172a;
    --text-muted: #64748b;
    --border-color: rgba(0, 0, 0, 0.08);
    --box-shadow-card: 0 10px 30px rgba(0, 0, 0, 0.06);
    --header-bg: rgba(255, 255, 255, 0.85);
    --controls-bg: rgba(255, 255, 255, 0.9);
    --old-q-color: #94a3b8;
    --new-q-color: #0f172a;
    --overlay-bg: rgba(248, 250, 252, 0.96);
}

/* Ukrycie ambient glow w motywie jasnym (Light Mode) */
body.light-theme .title-ambient-glow,
body.light-theme .closing-ambient-glow,
body.light-theme [class*="ambient-glow"],
body.light-theme [class*="-glow"] {
    display: none !important;
    opacity: 0 !important;
    visibility: hidden !important;
}


* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    height: 100%;
    overflow: hidden;
}

body {
    background-color: var(--bg-dark);
    color: var(--text-main);
    font-family: 'Asap', sans-serif;
    line-height: 1.6;
    user-select: none;
    transition: background-color 0.3s ease, color 0.3s ease;
}

h1, h2, h3, h4, .quote-text, .m-label, .new-q, .slide-counter, .overview-card-num {
    font-family: 'Asap', sans-serif;
}

/* Pasek postępu na górze */
.progress-bar-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 5px;
    background: rgba(255, 255, 255, 0.05);
    z-index: 1000;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #FE0467, #ff4785);
    transition: width 0.3s ease;
    box-shadow: 0 0 12px rgba(254, 4, 103, 0.8);
}

/* Górny Nagłówek z Logo Klienta */
.top-brand-header {
    position: fixed;
    top: 45px;
    left: 10%;
    z-index: 900;
    display: flex;
    align-items: center;
    gap: 15px;
    background: var(--header-bg);
    backdrop-filter: blur(12px);
    padding: 11px 18px 7px 18px;
    border-radius: 30px;
    border: 1px solid var(--border-color);
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    transition: all 0.3s ease;
}

.top-brand-header svg {
    height: 28px;
    width: auto;
}

svg path.logo-text {
    fill: var(--text-main);
}

.top-brand-tag {
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--text-muted);
    letter-spacing: 0.8px;
    text-transform: uppercase;
    border-left: 1px solid var(--border-color);
    padding-left: 12px;
}

/* Główny kontener prezentacji */
.deck-wrapper {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
}

/* Sekcje slajdów */
.slide-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    padding: 150px 10% 60px 10%;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 0.4s ease, transform 0.4s ease;
    transform: scale(0.96);
}

.slide-container.active {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transform: scale(1);
    z-index: 10;
}

/* Wyjątek wyśrodkowania dla slajdów wyśrodkowanych w pionie i poziomie */
#slide2,
#slide14,
#slide16,
#slide17,
#slide14_perspectives,
.slide-container.slide-14-container {
    justify-content: center;
    align-items: center;
    padding-top: 60px;
}

/* Typografia i nagłówki */
.benefit-label {
    font-size: 0.85rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 6px;
    color: #ffffff;
    margin-bottom: 8px;
    display: block;
    opacity: 0.95;
}

body.light-theme .benefit-label {
    color: #0f172a;
}

.slide-title {
    font-size: 2.8rem;
    font-weight: 600;
    margin-bottom: 16px;
    padding-bottom: 0;
    display: inline-block;
    max-width: fit-content;
    color: var(--text-main);
}

/* Ograniczenie szerokości nagłówków na slajdach z obrazem po prawej stronie */
.slide-container:has(.image-wrapper) .slide-title,
.slide-container:has(.image-wrapper) .benefit-label {
    max-width: 38vw;
    position: relative;
    z-index: 2;
}

.slide-title span {
    color: var(--accent-cyan);
}

/* Układy (Layouts) */
.two-column {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 50px;
    align-items: center;
    flex: 1;
    min-height: 0;
}

.two-column > div:first-child {
    display: flex;
    flex-direction: column;
    justify-content: center;
    max-width: 600px;
    z-index: 2;
}

.two-column p.lead {
    font-size: 1.8rem;
    color: var(--text-main);
    line-height: 1.3;
    margin-bottom: 30px;
    font-family: 'Asap', sans-serif;
    font-weight: 500;
}

.two-column p.lead span {
    color: var(--accent-cyan);
}

.feature-list {
    list-style: none;
}

.feature-list li {
    font-size: 1.2rem;
    margin-bottom: 16px;
    padding: 12px 18px;
    border-radius: 12px;
    display: flex;
    align-items: flex-start;
    gap: 15px;
    color: var(--text-muted);
    border: 1px solid transparent;
    transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    cursor: pointer;
}

.feature-list li i {
    color: var(--accent-cyan);
    font-size: 1.4rem;
    margin-top: 2px;
    transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
}

.bullet-content {
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.bullet-title {
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--text-main);
    display: block;
}

.bullet-desc {
    font-size: 1.05rem;
    color: var(--text-muted);
    line-height: 1.4;
    display: block;
}

/* Stany progresywnej animacji bulletów */
.feature-list li.bullet-dimmed {
    opacity: 0;
    visibility: hidden;
    transform: translateY(15px);
    pointer-events: none;
}

.feature-list li.bullet-active {
    opacity: 1;
    visibility: visible;
    color: var(--text-main);
    background: rgba(254, 4, 103, 0.09);
    border-color: rgba(254, 4, 103, 0.45);
    box-shadow: 0 8px 24px rgba(254, 4, 103, 0.18);
    transform: translateY(0) translateX(10px);
    pointer-events: auto;
}

.feature-list li.bullet-active i {
    transform: scale(1.2);
    color: #ff4785;
}

.feature-list li.bullet-normal {
    opacity: 0.9;
    visibility: visible;
    color: var(--text-main);
    transform: translateY(0) translateX(0);
    background: transparent;
    border-color: transparent;
    pointer-events: auto;
}

.image-wrapper {
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    width: 55vw;
    height: 100vh;
    border-radius: 0;
    overflow: hidden;
    box-shadow: none;
    z-index: 1;
    opacity: 0;
    transform: translateX(50px);
    transition: opacity 0.65s cubic-bezier(0.25, 1, 0.5, 1), transform 0.65s cubic-bezier(0.25, 1, 0.5, 1);
    will-change: opacity, transform;
}

.slide-container.active .image-wrapper {
    opacity: 1;
    transform: translateX(0);
}

.image-wrapper::after {
    display: none;
}

.image-wrapper img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    object-position: left center;
}




/* Kafelki (Tiles) */
.tiled-content {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 30px;
    margin-top: 20px;
}

.tile {
    background-color: var(--bg-card);
    padding: 40px 30px;
    border-radius: 16px;
    border: 1px solid var(--border-color);
    box-shadow: var(--box-shadow-card);
    transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
}

.tile:hover {
    transform: translateY(-5px);
    border-color: rgba(254, 4, 103, 0.5);
    box-shadow: 0 10px 30px rgba(254, 4, 103, 0.2);
}

/* Stany progresywnej animacji kafelków .tiled-content .tile */
.tiled-content .tile {
    cursor: pointer;
}

.tiled-content .tile .icon {
    transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
}

.tiled-content .tile.tile-dimmed {
    opacity: 0.35;
    filter: grayscale(70%);
    transform: translateY(0);
}

.tiled-content .tile.tile-active {
    opacity: 1;
    filter: grayscale(0%);
    border-color: rgba(254, 4, 103, 0.6);
    background: rgba(254, 4, 103, 0.08);
    box-shadow: 0 12px 35px rgba(254, 4, 103, 0.22);
    transform: translateY(-10px);
}

.tiled-content .tile.tile-active .icon {
    transform: translateY(-6px);
    color: #ff4785;
}

.tiled-content .tile.tile-normal {
    opacity: 0.95;
    filter: grayscale(0%);
    border-color: var(--border-color);
    background: var(--bg-card);
    transform: translateY(0);
}

.tile .icon {
    font-size: 2.5rem;
    color: var(--accent-cyan);
    margin-bottom: 25px;
}

.tile h3 {
    font-size: 1.5rem;
    margin-bottom: 15px;
    color: var(--text-main);
}

.tile p {
    color: var(--text-muted);
    font-size: 1.1rem;
    line-height: 1.6;
}

/* Layouty specjalne */
.slide-container.title-slide,
.title-slide {
    justify-content: center !important;
    align-items: flex-start !important;
    text-align: left !important;
    padding-left: 10% !important;
    padding-right: 10% !important;
}

.title-slide-logo {
    margin-bottom: 30px;
    align-self: flex-start;
}

.title-slide-logo svg {
    height: 52px;
    width: auto;
}

.title-slide h1 {
    font-size: 4.5rem;
    line-height: 1.1;
    margin-bottom: 30px;
    max-width: 1000px;
    color: var(--text-main);
    text-align: left !important;
}

.title-slide h1 span {
    color: var(--accent-cyan);
}

.title-slide .subtitle {
    font-size: 1.5rem;
    color: var(--text-muted);
    max-width: 750px;
    text-align: left !important;
}

#slide1,
#slide2 {
    overflow: hidden;
}

@keyframes ambientGlowOrganicMove {
    0% {
        transform: translate(-50%, -50%) scale(1) translate(0px, 0px);
    }
    25% {
        transform: translate(-50%, -50%) scale(1.12) translate(45px, -35px);
    }
    50% {
        transform: translate(-50%, -50%) scale(0.95) translate(-40px, 50px);
    }
    75% {
        transform: translate(-50%, -50%) scale(1.08) translate(35px, 25px);
    }
    100% {
        transform: translate(-50%, -50%) scale(1) translate(0px, 0px);
    }
}

.title-ambient-glow,
.closing-ambient-glow,
.photo-ambient-glow,
[class*="ambient-glow"] {
    position: absolute;
    top: 45%;
    left: 40%;
    transform: translate(-50%, -50%);
    width: 750px;
    height: 750px;
    background: radial-gradient(circle, rgba(254, 4, 103, 0.25) 0%, rgba(254, 4, 103, 0.14) 40%, rgba(250, 175, 0, 0.07) 65%, transparent 80%);
    filter: blur(80px);
    pointer-events: none;
    z-index: 0;
    animation: ambientGlowOrganicMove 18s cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
    will-change: transform;
}

#slide1 .title-slide-logo,
#slide1 h1,
#slide1 .subtitle {
    position: relative;
    z-index: 2;
}

/* Style dla Slajdu 2 */
.slide-title-minimal {
    font-size: 3.2rem;
    font-weight: 700;
    line-height: 1.15;
    margin-bottom: 40px;
    color: var(--text-main);
    text-align: center;
}

.slide-title-minimal span {
    color: var(--accent-cyan);
}

.executive-quote-box {
    background: var(--header-bg);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(254, 4, 103, 0.35);
    border-radius: 20px;
    padding: 28px 40px;
    margin: 0 auto 50px auto;
    max-width: 1200px;
    width: 100%;
    text-align: center;
    box-shadow: var(--box-shadow-card);
    transition: all 0.3s ease;
}

.quote-tag {
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 1.5px;
    color: var(--accent-cyan);
    text-transform: uppercase;
    margin-bottom: 12px;
    opacity: 0.9;
}

.quote-comparison {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 25px;
    flex-wrap: wrap;
}

.old-q {
    font-size: 1.2rem;
    color: var(--old-q-color);
    text-decoration: line-through;
    display: flex;
    align-items: center;
    gap: 8px;
}

.old-q i {
    color: var(--accent-red);
    font-size: 1rem;
}

.quote-sep {
    color: var(--accent-cyan);
    font-size: 1.2rem;
    opacity: 0.5;
}

.new-q {
    font-family: 'Asap', sans-serif;
    font-size: 1.45rem;
    font-weight: 700;
    color: var(--new-q-color);
    display: flex;
    align-items: center;
    gap: 10px;
}

.new-q i {
    color: #10b981;
    font-size: 1.3rem;
}

.new-q span {
    color: var(--accent-cyan);
}

.minimal-cascade {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    max-width: 1200px;
    margin: 0 auto;
    width: 100%;
}

.m-step {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 22px 14px;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    min-height: 155px;
    justify-content: center;
    box-shadow: var(--box-shadow-card);
    cursor: pointer;
    opacity: 0.3;
    transform: scale(0.97);
}

.m-step.step-normal {
    opacity: 0.75;
    transform: scale(1);
    border-color: var(--border-color);
}

.m-step.step-active {
    opacity: 1;
    transform: translateY(-8px) scale(1.04);
    border-color: var(--accent-cyan);
    box-shadow: 0 12px 30px rgba(254, 4, 103, 0.35);
}

.m-step.m-warning.step-active {
    border-color: var(--accent-red);
    box-shadow: 0 12px 30px rgba(239, 68, 68, 0.4);
}

.m-step.m-action.step-active {
    border-color: var(--accent-cyan);
    background: rgba(254, 4, 103, 0.18);
    box-shadow: 0 0 35px rgba(254, 4, 103, 0.5);
}

.m-icon {
    font-size: 1.8rem;
    color: var(--accent-cyan);
    margin-bottom: 12px;
    transition: transform 0.3s ease;
}

.m-step.step-active .m-icon {
    transform: scale(1.1);
}

.m-label {
    font-family: 'Asap', sans-serif;
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--text-main);
    margin-bottom: 5px;
    line-height: 1.2;
}

.m-sub {
    font-size: 0.82rem;
    color: var(--text-muted);
    line-height: 1.3;
}

.m-arrow {
    color: var(--text-muted);
    opacity: 0.4;
    font-size: 1.1rem;
    flex-shrink: 0;
}

.m-warning {
    border-color: rgba(239, 68, 68, 0.4);
    background: rgba(239, 68, 68, 0.05);
}

.m-warning .m-icon {
    color: var(--accent-red);
}

.m-action {
    border-color: var(--accent-cyan);
    background: rgba(254, 4, 103, 0.1);
    box-shadow: 0 0 25px rgba(254, 4, 103, 0.2);
}

.m-action .m-icon {
    color: #fff;
    background: var(--accent-cyan);
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.2rem;
    margin-bottom: 10px;
    box-shadow: 0 0 15px rgba(254, 4, 103, 0.6);
}

/* Cytat */
.quote-layout {
    text-align: center;
    max-width: 1000px;
    margin: 0 auto;
}

.quote-layout blockquote {
    font-size: 3.5rem;
    line-height: 1.2;
    margin-bottom: 30px;
    font-family: 'Asap', sans-serif;
    font-weight: 700;
    color: var(--text-main);
}

.quote-layout blockquote span {
    color: var(--accent-cyan);
}

.quote-layout cite {
    font-size: 1.4rem;
    color: var(--text-muted);
    font-style: normal;
}

/* Schemat Flow */
.flow-wrapper {
    margin-top: 50px;
    width: 100%;
    max-width: 1200px;
    margin-left: auto;
    margin-right: auto;
}

.flow-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: var(--bg-card);
    padding: 30px 40px;
    border-radius: 100px;
    border: 1px solid rgba(254, 4, 103, 0.4);
    box-shadow: var(--box-shadow-card);
    margin-bottom: 20px;
}

.flow-step {
    font-size: 1.2rem;
    font-weight: 600;
    color: var(--text-main);
    text-align: center;
}

.flow-arrow {
    color: var(--accent-cyan);
    font-size: 1.5rem;
}

.flow-bottom {
    display: flex;
    justify-content: space-around;
    padding: 0 50px;
}

.flow-system {
    color: var(--text-muted);
    font-size: 1rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 600;
}

/* Boczny klik / Nawigacja strzałkami na ekranie */
.nav-overlay-btn {
    position: fixed;
    top: 50%;
    transform: translateY(-50%);
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: var(--header-bg);
    border: 1px solid var(--border-color);
    color: var(--text-main);
    font-size: 1.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 500;
    backdrop-filter: blur(8px);
    transition: all 0.2s ease;
    opacity: 0.3;
}

.nav-overlay-btn:hover {
    opacity: 1;
    background: rgba(254, 4, 103, 0.85);
    border-color: var(--accent-cyan);
    color: #fff;
    box-shadow: 0 0 20px rgba(254, 4, 103, 0.6);
}

.nav-overlay-btn.prev-slide { left: 25px; }
.nav-overlay-btn.next-slide { right: 25px; }

/* Panel nawigacyjny na dole */
.controls-bar {
    position: fixed;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--controls-bg);
    backdrop-filter: blur(16px);
    border: 1px solid var(--border-color);
    border-radius: 40px;
    padding: 8px 20px;
    display: flex;
    align-items: center;
    gap: 15px;
    z-index: 1000;
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.25);
    transition: all 0.3s ease;
}

.ctrl-btn {
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-size: 1.2rem;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s ease;
}

.ctrl-btn:hover {
    color: var(--text-main);
    background: rgba(125, 125, 125, 0.15);
}

.ctrl-btn:active {
    transform: scale(0.95);
}

.slide-counter {
    font-family: 'Asap', sans-serif;
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--text-main);
    min-width: 65px;
    text-align: center;
    letter-spacing: 0.5px;
}

.divider {
    width: 1px;
    height: 20px;
    background: var(--border-color);
}

/* Siatka podglądu slajdów (Overview Modal) */
.overview-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: var(--overlay-bg);
    backdrop-filter: blur(20px);
    z-index: 2000;
    display: flex;
    flex-direction: column;
    padding: 40px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease, background-color 0.3s ease;
    overflow-y: auto;
}

.overview-overlay.active {
    opacity: 1;
    pointer-events: auto;
}

.overview-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
    padding-bottom: 15px;
    border-bottom: 1px solid var(--border-color);
}

.overview-header h2 {
    font-size: 2rem;
    color: var(--text-main);
}

.close-overview {
    background: rgba(125, 125, 125, 0.15);
    border: none;
    color: var(--text-main);
    font-size: 1.5rem;
    width: 45px;
    height: 45px;
    border-radius: 50%;
    cursor: pointer;
    transition: background 0.2s;
}

.close-overview:hover {
    background: var(--accent-cyan);
    color: #fff;
}

.overview-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
}

.overview-card {
    background: var(--bg-card);
    border: 2px solid var(--border-color);
    border-radius: 12px;
    padding: 20px;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 140px;
    box-shadow: var(--box-shadow-card);
}

.overview-card:hover {
    border-color: var(--accent-cyan);
    transform: translateY(-3px);
    box-shadow: 0 10px 25px rgba(254, 4, 103, 0.3);
}

.overview-card.current {
    border-color: var(--accent-cyan);
    background: rgba(254, 4, 103, 0.1);
}

.overview-card-num {
    font-family: 'Asap', sans-serif;
    font-weight: 700;
    font-size: 0.9rem;
    color: var(--accent-cyan);
    margin-bottom: 10px;
}

.overview-card-title {
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--text-main);
    line-height: 1.3;
}

/* Responsywność */
@media (max-width: 1024px) {
    .top-brand-header { top: 15px; left: 15px; padding: 6px 12px; }
    .top-brand-header svg { height: 22px; }
    .slide-container { padding: 40px 6%; }
    .two-column { grid-template-columns: 1fr; gap: 30px; }
    .minimal-cascade { flex-direction: column; gap: 15px; }
    .m-arrow { transform: rotate(90deg); }
    .tiled-content { grid-template-columns: 1fr; gap: 15px; }
    .title-slide h1 { font-size: 2.8rem; }
    .slide-title, .slide-title-minimal { font-size: 2.2rem; }
    .quote-layout blockquote { font-size: 2.2rem; }
    .flow-top { flex-direction: column; border-radius: 20px; gap: 15px; }
    .flow-arrow { transform: rotate(90deg); }
    .flow-bottom { display: none; }
    .nav-overlay-btn { display: none; }
}

/* Klasy pomocnicze do elimiacji styli inline w slajdach */
.slide-description {
    font-size: 1.5rem;
    color: var(--text-muted);
    max-width: 1024px;
    margin-bottom: 30px;
}

.slide-12-heading {
    font-size: 3rem;
    margin-bottom: 20px;
    font-weight: 600;
}

.slide-12-heading span {
    color: var(--accent-cyan);
}

.slide-12-grid {
    margin-top: 40px;
    align-items: stretch;
}

.slide-12-card-sub {
    font-size: 1.4rem;
    color: var(--text-main);
    margin-top: 15px;
    font-weight: 500;
}

.slide-12-card-highlight {
    border-color: var(--accent-cyan);
    background: rgba(254, 4, 103, 0.05);
}

.slide-13-title {
    margin: 0 auto 40px auto;
    display: block;
    text-align: center;
}

.slide-13-note {
    text-align: center;
    margin-top: 50px;
    font-size: 1.4rem;
    color: var(--text-muted);
    max-width: 900px;
    margin-left: auto;
    margin-right: auto;
}

.slide-13-note span {
    color: var(--text-main);
    font-weight: 500;
}

.flow-arrow-muted {
    color: var(--text-muted);
    opacity: 0.5;
}

.slide-14-container {
    align-items: center;
    text-align: center;
}

.slide-14-title {
    font-size: 4.5rem;
    margin-bottom: 50px;
    color: var(--text-main);
}

.slide-14-title span {
    color: var(--accent-cyan);
}

.slide-14-list {
    display: flex;
    flex-direction: column;
    gap: 20px;
    text-align: left;
    width: 100%;
    max-width: 800px;
}

.slide-14-item {
    display: flex;
    align-items: center;
    gap: 25px;
    padding: 25px 40px;
}

.slide-14-item i {
    font-size: 2rem;
    color: var(--accent-cyan);
}

.slide-14-item p {
    font-size: 1.6rem;
    color: var(--text-main);
    margin: 0;
    font-family: 'Asap', sans-serif;
    font-weight: 500;
}

.slide-14-item-active {
    border-color: var(--accent-cyan);
    background: rgba(254, 4, 103, 0.05);
}

.slide-14-item-active p {
    color: var(--accent-cyan);
    font-weight: 600;
}

.tile-title-muted {
    color: var(--text-muted);
    font-size: 1.8rem;
}

.tile-title-cyan {
    color: var(--accent-cyan);
    font-size: 1.8rem;
}

.card-desc {
    margin-top: 10px;
}

/* Slajd 14 - Dlaczego ekosystem, a nie jeden monolit */
.slide-subtitle-narrative {
    font-size: 1.15rem;
    font-weight: 400;
    color: var(--text-muted);
    display: block;
    margin-top: 6px;
}

.slide-subtitle-narrative strong {
    color: var(--accent-cyan);
    font-weight: 600;
}

.ecosystem-layers {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    margin: auto 0;
}

.layer-card {
    flex: 1;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 22px 20px;
    box-shadow: var(--box-shadow-card);
    transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    flex-direction: column;
    gap: 8px;
    cursor: pointer;
}

.layer-card:hover {
    border-color: rgba(254, 4, 103, 0.4);
    transform: translateY(-4px);
    box-shadow: 0 12px 30px rgba(254, 4, 103, 0.15);
}

.layer-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 4px;
}

.layer-icon {
    width: 42px;
    height: 42px;
    border-radius: 10px;
    background: rgba(0, 242, 254, 0.1);
    color: var(--accent-cyan);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.3rem;
    transition: all 0.35s ease;
}

.layer-step {
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text-muted);
    background: rgba(255, 255, 255, 0.06);
    padding: 4px 10px;
    border-radius: 20px;
}

.layer-title {
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--text-main);
    margin: 0;
}

.layer-sub {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--accent-cyan);
    margin: 0;
}

.layer-desc {
    font-size: 0.92rem;
    color: var(--text-muted);
    line-height: 1.4;
    margin: 0;
}

.layer-connector {
    color: var(--text-muted);
    font-size: 1.2rem;
    opacity: 0.5;
    flex-shrink: 0;
}

/* Stany animacji kafelków warstw na Slajdzie 14 */
.layer-card.tile-dimmed {
    opacity: 0.35;
    filter: grayscale(70%);
    transform: translateY(0);
}

.layer-card.tile-active {
    opacity: 1;
    filter: grayscale(0%);
    border-color: rgba(254, 4, 103, 0.6);
    background: rgba(254, 4, 103, 0.08);
    box-shadow: 0 12px 35px rgba(254, 4, 103, 0.22);
    transform: translateY(-8px);
}

.layer-card.tile-active .layer-icon {
    background: rgba(254, 4, 103, 0.2);
    color: #ff4785;
}

.layer-card.tile-normal {
    opacity: 0.95;
    filter: grayscale(0%);
    border-color: var(--border-color);
    background: var(--bg-card);
    transform: translateY(0);
}

/* Dwie Perspektywy Korzyści */
.perspective-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-top: 25px;
    margin-bottom: 75px;
}

.perspective-card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    transition: all 0.3s ease;
}

.perspective-card.pers-client {
    border-left: 4px solid var(--accent-cyan);
}

.perspective-card.pers-operator {
    border-left: 4px solid #FE0467;
    background: linear-gradient(135deg, var(--bg-card) 0%, rgba(254, 4, 103, 0.05) 100%);
}

.perspective-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
}

.pers-badge {
    font-size: 0.78rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    gap: 8px;
}

.pers-client .pers-badge i {
    color: var(--accent-cyan);
}

.pers-operator .pers-badge i {
    color: #FE0467;
}

.pers-title {
    font-size: 1.25rem;
    font-weight: 700;
    color: var(--text-main);
}

.pers-desc {
    font-size: 0.92rem;
    color: var(--text-muted);
    line-height: 1.4;
}

/* Sekcja Logotypów na Slajdzie Końcowym (Slide 16) */
.partner-logos-container {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 30px;
    margin-top: 15px;
    padding: 16px 36px;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 50px;
    box-shadow: var(--box-shadow-card);
    width: fit-content;
    margin-left: auto;
    margin-right: auto;
    transition: all 0.3s ease;
}

.partner-logos-container:hover {
    border-color: rgba(254, 4, 103, 0.3);
    box-shadow: 0 10px 30px rgba(254, 4, 103, 0.12);
}

.logo-placeholder-card {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 4px 10px;
    border-radius: 12px;
    transition: all 0.3s ease;
}

.logo-placeholder-card:hover {
    transform: translateY(-2px);
}

.logo-ph-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
    color: var(--accent-cyan);
}

.logo-ph-icon svg {
    height: 24px;
    width: auto;
}

.logo-ph-label {
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--text-muted);
}

.logo-ph-divider {
    width: 1px;
    height: 24px;
    background: var(--border-color);
}

.partner-logo-img {
    height: 34px;
    width: auto;
    display: block;
}

body:not(.light-theme) .partner-logo-img.logo-dark {
    display: block !important;
}

body:not(.light-theme) .partner-logo-img.logo-light {
    display: none !important;
}

body.light-theme .partner-logo-img.logo-dark {
    display: none !important;
}

body.light-theme .partner-logo-img.logo-light {
    display: block !important;
}

.partner-brand-text {
    font-size: 1.1rem;
    font-weight: 800;
    letter-spacing: 1.5px;
    color: var(--text-main);
    font-family: 'Outfit', sans-serif;
    text-transform: uppercase;
}

/* Układ pionowy kafelków na Slajdzie 16 (ikona po lewej, tekst po prawej) */
.stacked-cards-container {
    display: flex;
    flex-direction: column;
    gap: 20px;
    max-width: 850px;
    width: 100%;
    margin: 30px auto 0 auto;
}

.stacked-card {
    display: flex;
    align-items: center;
    gap: 25px;
    padding: 24px 32px;
    border-radius: 18px;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    box-shadow: var(--box-shadow-card);
    transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    cursor: pointer;
}

.stacked-card:hover {
    transform: translateY(-4px) translateX(6px);
    border-color: rgba(254, 4, 103, 0.5);
    box-shadow: 0 10px 30px rgba(254, 4, 103, 0.18);
}

.card-icon {
    width: 54px;
    height: 54px;
    border-radius: 14px;
    background: rgba(0, 242, 254, 0.1);
    color: var(--accent-cyan);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.6rem;
    flex-shrink: 0;
    transition: all 0.35s ease;
}

.card-body {
    display: flex;
    flex-direction: column;
    gap: 4px;
    text-align: left;
}

.card-title {
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--text-main);
    margin: 0;
}

.card-desc {
    font-size: 0.98rem;
    color: var(--text-muted);
    line-height: 1.45;
    margin: 0;
}

/* Stany progresywnej animacji kafelków pionowych */
.stacked-card.tile-dimmed {
    opacity: 0.35;
    filter: grayscale(70%);
    transform: translateY(0);
}

.stacked-card.tile-active {
    opacity: 1;
    filter: grayscale(0%);
    border-color: rgba(254, 4, 103, 0.6);
    background: rgba(254, 4, 103, 0.08);
    box-shadow: 0 12px 35px rgba(254, 4, 103, 0.22);
    transform: translateY(-4px) translateX(8px);
}

.stacked-card.tile-active .card-icon {
    background: rgba(254, 4, 103, 0.2);
    color: #ff4785;
    transform: scale(1.08);
}

.stacked-card.tile-normal {
    opacity: 0.95;
    filter: grayscale(0%);
    border-color: var(--border-color);
    background: var(--bg-card);
    transform: translateY(0);
}

/* Dedykowany Slajd Końcowy (Slide 17) */
.final-closing-slide {
    justify-content: center !important;
    align-items: center !important;
    text-align: center !important;
    overflow: hidden;
    padding: 130px 10% 70px 10% !important;
}

.closing-ambient-glow {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 750px;
    height: 750px;
    background: radial-gradient(circle, rgba(254, 4, 103, 0.25) 0%, rgba(254, 4, 103, 0.14) 40%, rgba(250, 175, 0, 0.07) 65%, transparent 80%);
    filter: blur(80px);
    pointer-events: none;
    z-index: 1;
}

.closing-content-wrapper {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    max-width: 900px;
    width: 100%;
}

.end-badge {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    font-size: 0.82rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #ff4785;
    background: rgba(254, 4, 103, 0.12);
    border: 1px solid rgba(254, 4, 103, 0.35);
    padding: 8px 22px;
    border-radius: 30px;
    margin-bottom: 24px;
    box-shadow: 0 4px 20px rgba(254, 4, 103, 0.2);
}

.end-badge i {
    color: #ff4785;
    font-size: 1rem;
}

.closing-title {
    font-size: 3.8rem;
    font-weight: 700;
    line-height: 1.15;
    color: var(--text-main);
    margin-bottom: 20px;
    text-align: center;
}

.closing-title span {
    color: var(--accent-cyan);
}

.closing-lead {
    font-size: 1.35rem;
    color: var(--text-muted);
    line-height: 1.5;
    max-width: 720px;
    margin-bottom: 35px;
    font-weight: 400;
}

/* Interaktywne chipy dyskusyjne */
.closing-interactive-chips {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    margin-bottom: 40px;
    flex-wrap: wrap;
}

.chip-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 22px;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 40px;
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--text-main);
    box-shadow: var(--box-shadow-card);
    transition: all 0.3s ease;
    cursor: pointer;
}

.chip-item:hover {
    transform: translateY(-3px);
    border-color: rgba(254, 4, 103, 0.5);
    background: rgba(254, 4, 103, 0.08);
    box-shadow: 0 8px 25px rgba(254, 4, 103, 0.18);
}

.chip-item i {
    color: var(--accent-cyan);
    font-size: 1.1rem;
}

/* Slajd 15 - Case Study Proces End-to-End */
.case-study-flow {
    display: flex;
    align-items: stretch;
    justify-content: space-between;
    gap: 18px;
    margin: 45px 0 35px 0;
}

.case-step-card {
    flex: 1;
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 26px 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    position: relative;
    box-shadow: var(--box-shadow-card);
    transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    cursor: pointer;
}

.case-step-num {
    position: absolute;
    top: 12px;
    right: 14px;
    font-size: 0.72rem;
    font-weight: 800;
    color: var(--text-muted);
    opacity: 0.5;
}

.case-step-icon {
    width: 48px;
    height: 48px;
    border-radius: 14px;
    background: rgba(0, 242, 254, 0.1);
    color: var(--accent-cyan);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
    margin-bottom: 14px;
    transition: all 0.35s ease;
}

.case-step-title {
    font-size: 1.08rem;
    font-weight: 700;
    color: var(--text-main);
    margin: 0 0 8px 0;
    line-height: 1.2;
}

.case-step-badge {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--accent-cyan);
    background: rgba(0, 242, 254, 0.08);
    padding: 4px 10px;
    border-radius: 12px;
    margin: 0 0 10px 0;
}

.case-step-desc {
    font-size: 0.86rem;
    color: var(--text-muted);
    line-height: 1.4;
    margin: 0;
}

.case-step-desc strong {
    color: var(--text-main);
}

.case-flow-arrow {
    color: var(--text-muted);
    font-size: 1.15rem;
    opacity: 0.4;
    display: flex;
    align-items: center;
    flex-shrink: 0;
}

/* Animacje sub-step dla .case-step-card */
.case-step-card.tile-dimmed {
    opacity: 0.35;
    filter: grayscale(70%);
    transform: translateY(0);
}

.case-step-card.tile-active {
    opacity: 1;
    filter: grayscale(0%);
    border-color: rgba(254, 4, 103, 0.6);
    background: rgba(254, 4, 103, 0.08);
    box-shadow: 0 12px 35px rgba(254, 4, 103, 0.22);
    transform: translateY(-8px);
}

.case-step-card.tile-active .case-step-icon {
    background: rgba(254, 4, 103, 0.2);
    color: #ff4785;
    transform: scale(1.1);
}

.case-step-card.tile-normal {
    opacity: 0.95;
    filter: grayscale(0%);
    border-color: var(--border-color);
    background: var(--bg-card);
    transform: translateY(0);
}

/* Schemat systemowy pod spodem małym tekstem */
.system-flow-subline {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 24px;
    margin: 35px 0 40px 0;
    font-size: 0.88rem;
    color: var(--text-muted);
    opacity: 0.9;
}

.sys-step {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--border-color);
    padding: 8px 22px;
    border-radius: 24px;
    font-weight: 500;
}

.sys-step i {
    color: var(--accent-cyan);
    font-size: 0.95rem;
}

.sys-arrow {
    opacity: 0.4;
    font-size: 0.9rem;
}

/* Puenta podsumowania Case Study */
.case-study-summary {
    display: flex;
    align-items: center;
    gap: 20px;
    background: rgba(254, 4, 103, 0.06);
    border: 1px solid rgba(254, 4, 103, 0.3);
    border-radius: 18px;
    padding: 20px 32px;
    max-width: 1050px;
    margin: 15px auto 0 auto;
}

.summary-icon {
    font-size: 1.4rem;
    color: #FE0467;
    flex-shrink: 0;
}

.case-study-summary p {
    font-size: 0.92rem;
    color: var(--text-main);
    line-height: 1.45;
    margin: 0;
}

.case-study-summary p strong {
    color: var(--accent-cyan);
    font-weight: 600;
}

    <script>
// Silnik interaktywny prezentacji CHOPIN
document.addEventListener('DOMContentLoaded', () => {
    const slides = document.querySelectorAll('.slide-container');
    const totalSlides = slides.length;
    let currentSlide = 0;
    let currentSubStep = 0;

    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const overlayPrevBtn = document.getElementById('overlayPrevBtn');
    const overlayNextBtn = document.getElementById('overlayNextBtn');
    const slideCounter = document.getElementById('slideCounter');
    const progressBar = document.getElementById('progressBar');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const overviewBtn = document.getElementById('overviewBtn');
    const overviewOverlay = document.getElementById('overviewOverlay');
    const closeOverviewBtn = document.getElementById('closeOverviewBtn');
    const overviewGrid = document.getElementById('overviewGrid');

    // Przełączanie Motywu Jasny/Ciemny
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const themeIcon = document.getElementById('themeIcon');

    function applyTheme(theme) {
        if (theme === 'light') {
            document.body.classList.add('light-theme');
            themeIcon.className = 'fa-solid fa-moon';
            themeToggleBtn.title = 'Przełącz na motyw Ciemny (T)';
        } else {
            document.body.classList.remove('light-theme');
            themeIcon.className = 'fa-solid fa-sun';
            themeToggleBtn.title = 'Przełącz na motyw Jasny (T)';
        }
        localStorage.setItem('presentation_theme', theme);
    }

    function toggleTheme() {
        const currentTheme = document.body.classList.contains('light-theme') ? 'light' : 'dark';
        const newTheme = currentTheme === 'light' ? 'dark' : 'light';
        applyTheme(newTheme);
    }

    const savedTheme = localStorage.getItem('presentation_theme') || 'dark';
    applyTheme(savedTheme);

    themeToggleBtn.addEventListener('click', toggleTheme);

    const slideCompleted = {};

    function getSubStepElements(slideIndex) {
        const slide = slides[slideIndex];
        if (!slide) return [];

        const caseFlow = slide.querySelector('.case-study-flow');
        if (caseFlow) {
            const caseItems = slide.querySelectorAll('.case-step-card, .case-summary-trigger');
            if (caseItems.length > 0) return Array.from(caseItems);
        }

        const mSteps = slide.querySelectorAll('#slide2Cascade .m-step');
        if (mSteps.length > 0) return Array.from(mSteps);

        const featureBullets = slide.querySelectorAll('.feature-list li');
        if (featureBullets.length > 0) return Array.from(featureBullets);

        const tiles = slide.querySelectorAll('.tiled-content .tile');
        if (tiles.length > 0) return Array.from(tiles);

        const layers = slide.querySelectorAll('.layer-card');
        if (layers.length > 0) return Array.from(layers);

        const stackedCards = slide.querySelectorAll('.stacked-card');
        if (stackedCards.length > 0) return Array.from(stackedCards);

        const caseSteps = slide.querySelectorAll('.case-step-card');
        if (caseSteps.length > 0) return Array.from(caseSteps);

        return [];
    }

    function updateSubSteps() {
        const elements = getSubStepElements(currentSlide);
        if (elements.length === 0) return;

        const isCaseStudy = slides[currentSlide].querySelector('.case-study-flow');
        if (isCaseStudy) {
            const slideEl = slides[currentSlide];
            const track = slideEl.querySelector('#caseVTrack');
            const totalSteps = 6;
            const current = Math.min(Math.max(currentSubStep, 1), totalSteps);

            // Kroki 1 do 5: Pionowy przesuw i wyostrzenie TYLKO 1 kafelka naraz
            if (current <= 5) {
                slideEl.classList.remove('mode-overview');
                const stepIdx = current - 1; // 0..4
                const cardHeightWithGap = 340;
                const vShift = -stepIdx * cardHeightWithGap;

                if (track) {
                    track.style.transform = `translateY(${vShift}px)`;
                }

                elements.forEach((el, idx) => {
                    const stepNum = idx + 1;
                    el.classList.remove('tile-active', 'tile-normal', 'tile-dimmed', 'tile-passed');
                    if (stepNum === current) {
                        el.classList.add('tile-active');
                    } else if (stepNum < current) {
                        el.classList.add('tile-passed');
                    } else {
                        el.classList.add('tile-dimmed');
                    }
                });
            } else {
                // Krok 6: Tryb pełnego podsumowania (wszystkie kafelki w 1 rzędzie + podsumowanie)
                slideEl.classList.add('mode-overview');
                if (track) {
                    track.style.transform = 'none';
                }
                elements.forEach((el) => {
                    el.classList.remove('tile-dimmed', 'tile-active', 'tile-passed');
                    el.classList.add('tile-normal');
                });
            }
            // Aktualizacja bocznego wskaźnika postępu (case-indicator-dot)
            const indicatorDots = slideEl.querySelectorAll('.case-indicator-dot');
            indicatorDots.forEach((dot) => {
                const stepNum = parseInt(dot.getAttribute('data-step'), 10);
                if (stepNum === current) {
                    dot.classList.add('active');
                } else {
                    dot.classList.remove('active');
                }
            });
            return;
        }

        const isCascade = slides[currentSlide].querySelector('#slide2Cascade');
        const isBullets = slides[currentSlide].querySelector('.feature-list');
        const isTiles = slides[currentSlide].querySelector('.tiled-content, .ecosystem-layers, .stacked-cards-container, .concentric-nested-wrapper, .concentric-ecosystem-slide');

        elements.forEach((el, idx) => {
            const stepNum = idx + 1;
            el.classList.remove('step-active', 'step-normal', 'bullet-active', 'bullet-normal', 'bullet-dimmed', 'tile-active', 'tile-normal', 'tile-dimmed');

            if (isCascade) {
                if (stepNum === currentSubStep) {
                    el.classList.add('step-active');
                } else if (stepNum < currentSubStep) {
                    el.classList.add('step-normal');
                }
            } else if (isBullets) {
                if (stepNum === currentSubStep) {
                    el.classList.add('bullet-active');
                } else if (stepNum < currentSubStep) {
                    el.classList.add('bullet-normal');
                } else {
                    el.classList.add('bullet-dimmed');
                }
            } else if (isTiles) {
                if (stepNum === currentSubStep) {
                    el.classList.add('tile-active');
                } else if (stepNum < currentSubStep) {
                    el.classList.add('tile-normal');
                } else {
                    el.classList.add('tile-dimmed');
                }
            }
        });
    }

    // Kliknięcie bezpośrednio w kafelek / bullet / dot
    slides.forEach((slide, sIdx) => {
        const elements = getSubStepElements(sIdx);
        elements.forEach((el, eIdx) => {
            el.addEventListener('click', (e) => {
                if (e) e.stopPropagation();
                if (currentSlide === sIdx) {
                    currentSubStep = eIdx + 1;
                    updateSubSteps();
                }
            });
        });

        const dots = slide.querySelectorAll('.case-dot-node, .case-indicator-dot');
        dots.forEach((dot) => {
            dot.addEventListener('click', (e) => {
                if (e) e.stopPropagation();
                if (currentSlide === sIdx) {
                    const stepAttr = dot.getAttribute('data-step');
                    if (stepAttr) {
                        currentSubStep = parseInt(stepAttr, 10);
                    }
                    updateSubSteps();
                }
            });
        });
    });


    let autoLoopInterval = null;

    function stopAutoLoop() {
        if (autoLoopInterval) {
            clearInterval(autoLoopInterval);
            autoLoopInterval = null;
        }
    }

    function startAutoLoop(slideIndex) {
        stopAutoLoop();
        const slide = slides[slideIndex];
        if (!slide || !slide.hasAttribute('data-auto-loop')) return;

        const subStepElements = getSubStepElements(slideIndex);
        if (subStepElements.length === 0) return;

        // Wyzerowanie: każde wejście na slajd zaczyna animację od pętli od początku (krok 1)
        currentSubStep = 1;
        updateSubSteps();

        autoLoopInterval = setInterval(() => {
            if (currentSlide !== slideIndex) {
                stopAutoLoop();
                return;
            }
            const elements = getSubStepElements(slideIndex);
            if (elements.length > 0) {
                currentSubStep = (currentSubStep % elements.length) + 1;
                updateSubSteps();
            }
        }, 1300);
    }

    function getSlideFromHash() {
        const hash = window.location.hash.replace('#', '');
        const num = parseInt(hash, 10);
        if (!isNaN(num) && num >= 1 && num <= totalSlides) {
            return num - 1;
        }
        return 0;
    }

    function goToSlide(index, fromPrev = true) {
        stopAutoLoop();

        if (index < 0) index = 0;
        if (index >= totalSlides) index = totalSlides - 1;

        slides.forEach((slide, idx) => {
            if (idx === index) {
                slide.classList.add('active');
            } else {
                slide.classList.remove('active');
            }
        });

        currentSlide = index;

        const subStepElements = getSubStepElements(currentSlide);
        if (subStepElements.length > 0) {
            // Zasada globalna: Pierwszy element jest zawsze domyślnie aktywny (highlight) na start
            const startAttr = slides[currentSlide].getAttribute('data-start-step');
            currentSubStep = startAttr ? parseInt(startAttr, 10) : 1;
            updateSubSteps();
        }

        if (slides[currentSlide] && slides[currentSlide].hasAttribute('data-auto-loop')) {
            startAutoLoop(currentSlide);
        }

        slideCounter.textContent = `${currentSlide + 1} / ${totalSlides}`;
        
        const progress = ((currentSlide + 1) / totalSlides) * 100;
        progressBar.style.width = `${progress}%`;

        history.replaceState(null, null, `#${currentSlide + 1}`);
        updateOverviewCards();
    }

    function nextSlide() {
        const currentSlideEl = slides[currentSlide];
        if (currentSlideEl && currentSlideEl.hasAttribute('data-auto-loop')) {
            if (currentSlide < totalSlides - 1) {
                goToSlide(currentSlide + 1, true);
            }
            return;
        }

        const subStepElements = getSubStepElements(currentSlide);
        if (subStepElements.length > 0 && currentSubStep < subStepElements.length) {
            currentSubStep++;
            updateSubSteps();
            return;
        }

        if (currentSlide < totalSlides - 1) {
            goToSlide(currentSlide + 1, true);
        }
    }

    function prevSlide() {
        const currentSlideEl = slides[currentSlide];
        if (currentSlideEl && currentSlideEl.hasAttribute('data-auto-loop')) {
            if (currentSlide > 0) {
                goToSlide(currentSlide - 1, false);
            }
            return;
        }

        const subStepElements = getSubStepElements(currentSlide);
        if (subStepElements.length > 0 && currentSubStep > 1) {
            currentSubStep--;
            updateSubSteps();
            return;
        }

        if (currentSlide > 0) {
            goToSlide(currentSlide - 1, false);
        }
    }

    const overviewTitlesMap = [
        "Ekosystem Nowoczesnego Operatora",
        "Wzrost Bez Rozrostu Kosztów",
        "Łańcuch Obciążenia Operacyjnego",
        "Odpowiedź Na Wyzwania Skalowania",
        "Samoobsługa Klienta W eBOK",
        "Redukcja Rutyny W BOK",
        "Podgląd Aplikacji Abonenta",
        "Automatyzacja Procesów Back-Office",
        "Pełny Widok Klienta 360°",
        "Pulpit Nawigacyjny Operatora",
        "Mobilny Cyfrowy Technik",
        "Błyskawiczne Realizacje Zleceń",
        "Podgląd Aplikacji Technika",
        "Transparentny Status Zlecenia",
        "Status Zlecenia Na Żywo",
        "Podgląd Postępu Realizacji",
        "Jedna Platforma Dla Spółek",
        "Zwinna Absorpcja Nowych Podmiotów",
        "Wspólny Ekosystem 5 Spółek",
        "Ekosystem Zamiast Sztywnego Monolitu",
        "3 Warstwy Ekosystemu Operacyjnego",
        "Dwie Perspektywy Wspólnej Wartości",
        "Proces End-to-End W Praktyce",
        "Gotowość Na Bezpieczne Skalowanie",
        "Podsumowanie Oraz Pytania Q&A"
    ];

    function initOverview() {
        overviewGrid.innerHTML = '';
        slides.forEach((slide, idx) => {
            const card = document.createElement('div');
            card.className = `overview-card ${idx === currentSlide ? 'current' : ''}`;
            card.dataset.index = idx;

            let titleText = slide.getAttribute('data-overview-title') || overviewTitlesMap[idx];
            if (!titleText) {
                const heading = slide.querySelector('h1, h2');
                if (heading) {
                    titleText = heading.textContent.replace(/\s+/g, ' ').trim();
                    if (titleText.length > 50) {
                        titleText = titleText.substring(0, 50) + '...';
                    }
                } else {
                    titleText = `Slajd ${idx + 1}`;
                }
            }

            card.innerHTML = `
                <div class="overview-card-num">SLAJD ${idx + 1}</div>
                <div class="overview-card-title">${titleText}</div>
            `;

            card.addEventListener('click', () => {
                goToSlide(idx);
                toggleOverview(false);
            });

            overviewGrid.appendChild(card);
        });
    }

    function updateOverviewCards() {
        const cards = overviewGrid.querySelectorAll('.overview-card');
        cards.forEach((card, idx) => {
            if (idx === currentSlide) {
                card.classList.add('current');
            } else {
                card.classList.remove('current');
            }
        });
    }

    function toggleOverview(show) {
        if (show === undefined) {
            overviewOverlay.classList.toggle('active');
        } else if (show) {
            overviewOverlay.classList.add('active');
        } else {
            overviewOverlay.classList.remove('active');
        }
    }

    function toggleFullscreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(err => {
                console.warn(`Błąd pełnego ekranu: ${err.message}`);
            });
        } else {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            }
        }
    }

    prevBtn.addEventListener('click', prevSlide);
    nextBtn.addEventListener('click', nextSlide);
    overlayPrevBtn.addEventListener('click', prevSlide);
    overlayNextBtn.addEventListener('click', nextSlide);
    fullscreenBtn.addEventListener('click', toggleFullscreen);
    overviewBtn.addEventListener('click', () => toggleOverview(true));
    closeOverviewBtn.addEventListener('click', () => toggleOverview(false));

    // Modal Komentarzy (Netlify Forms)
    const commentBtn = document.getElementById('commentBtn');
    const commentOverlay = document.getElementById('commentOverlay');
    const closeCommentBtn = document.getElementById('closeCommentBtn');
    const cancelCommentBtn = document.getElementById('cancelCommentBtn');
    const commentForm = document.getElementById('commentForm');
    const commentSlideBadge = document.getElementById('commentSlideBadge');
    const commentSlideInput = document.getElementById('commentSlideInput');
    const commentSlideTitleInput = document.getElementById('commentSlideTitleInput');
    const commentSuccessMsg = document.getElementById('commentSuccessMsg');
    const closeSuccessBtn = document.getElementById('closeSuccessBtn');
    const successSlideRef = document.getElementById('successSlideRef');

    function getSlideTitle(slideIndex) {
        const slide = slides[slideIndex];
        if (!slide) return `Slajd ${slideIndex + 1}`;
        const heading = slide.querySelector('h1, h2, .slide-title, .title');
        return heading ? heading.innerText.trim().replace(/\n+/g, ' ') : `Slajd ${slideIndex + 1}`;
    }

    function toggleCommentModal(open) {
        if (!commentOverlay) return;
        const shouldOpen = open !== undefined ? open : !commentOverlay.classList.contains('active');
        if (shouldOpen) {
            const slideNum = currentSlide + 1;
            const slideTitle = getSlideTitle(currentSlide);
            if (commentSlideBadge) commentSlideBadge.innerText = `Slajd #${slideNum}`;
            if (commentSlideInput) commentSlideInput.value = slideNum;
            if (commentSlideTitleInput) commentSlideTitleInput.value = slideTitle;
            if (successSlideRef) successSlideRef.innerText = `Slajdu #${slideNum}`;

            if (commentForm) {
                commentForm.reset();
                commentForm.style.display = 'flex';
            }
            if (commentSuccessMsg) commentSuccessMsg.style.display = 'none';

            commentOverlay.classList.add('active');
            const commentText = document.getElementById('commentText');
            if (commentText) setTimeout(() => commentText.focus(), 100);
        } else {
            commentOverlay.classList.remove('active');
        }
    }

    if (commentBtn) commentBtn.addEventListener('click', () => toggleCommentModal(true));
    if (closeCommentBtn) closeCommentBtn.addEventListener('click', () => toggleCommentModal(false));
    if (cancelCommentBtn) cancelCommentBtn.addEventListener('click', () => toggleCommentModal(false));
    if (closeSuccessBtn) closeSuccessBtn.addEventListener('click', () => toggleCommentModal(false));
    if (commentOverlay) {
        commentOverlay.addEventListener('click', (e) => {
            if (e.target === commentOverlay) toggleCommentModal(false);
        });
    }

    if (commentForm) {
        commentForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const formData = new FormData(commentForm);
            const submitBtn = document.getElementById('submitCommentBtn');
            if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Wysyłanie...';
            }

            const isLocal = window.location.protocol === 'file:' || 
                            window.location.hostname === 'localhost' || 
                            window.location.hostname === '127.0.0.1';

            if (isLocal) {
                setTimeout(() => {
                    if (commentForm) commentForm.style.display = 'none';
                    if (commentSuccessMsg) {
                        commentSuccessMsg.style.display = 'flex';
                        let note = commentSuccessMsg.querySelector('.local-demo-note');
                        if (!note) {
                            note = document.createElement('p');
                            note.className = 'local-demo-note';
                            note.style.cssText = 'font-size: 0.82rem; color: #eab308; margin-top: 8px; font-style: italic; background: rgba(234, 179, 8, 0.1); padding: 6px 12px; border-radius: 8px; border: 1px solid rgba(234, 179, 8, 0.2);';
                            note.innerText = '💡 Tryb podglądu lokalnego: Po opublikowaniu na Netlify ten komentarz trafi na Twój e-mail.';
                            commentSuccessMsg.appendChild(note);
                        }
                    }
                    if (submitBtn) {
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Wyślij uwagę';
                    }
                }, 400);
                return;
            }

            const bodyData = new URLSearchParams(formData);
            if (!bodyData.get('form-name')) {
                bodyData.set('form-name', 'presentation-comments');
            }

            fetch('/', {
                method: 'POST',
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: bodyData.toString()
            })
            .then((res) => {
                if (res.ok || res.status < 400) {
                    if (commentForm) commentForm.style.display = 'none';
                    if (commentSuccessMsg) {
                        const note = commentSuccessMsg.querySelector('.local-demo-note');
                        if (note) note.remove();
                        commentSuccessMsg.style.display = 'flex';
                    }
                } else {
                    console.error('Błąd odpowiedzi Netlify:', res.status);
                    alert('Błąd serwera Netlify (' + res.status + '). Upewnij się, że wgrałeś aktualną wersję z ukrytym formularzem.');
                }
            })
            .catch((err) => {
                console.error('Błąd wysyłania komentarza:', err);
                alert('Błąd sieci podczas wysyłania komentarza. Spróbuj ponownie.');
            })
            .finally(() => {
                if (submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Wyślij uwagę';
                }
            });
        });
    }

    document.addEventListener('keydown', (e) => {
        if (commentOverlay && commentOverlay.classList.contains('active')) {
            if (e.key === 'Escape') {
                toggleCommentModal(false);
            }
            return;
        }

        if (overviewOverlay.classList.contains('active')) {
            if (e.key === 'Escape' || e.key === 'o' || e.key === 'O') {
                toggleOverview(false);
            }
            return;
        }

        if (document.activeElement && (document.activeElement.tagName === 'INPUT' || document.activeElement.tagName === 'TEXTAREA')) {
            return;
        }

        switch (e.key) {
            case 'ArrowRight':
            case 'ArrowDown':
            case ' ':
            case 'PageDown':
            case 'Enter':
                e.preventDefault();
                nextSlide();
                break;
            case 'ArrowLeft':
            case 'ArrowUp':
            case 'PageUp':
            case 'Backspace':
                e.preventDefault();
                prevSlide();
                break;
            case 'Home':
                e.preventDefault();
                goToSlide(0);
                break;
            case 'End':
                e.preventDefault();
                goToSlide(totalSlides - 1);
                break;
            case 'f':
            case 'F':
                toggleFullscreen();
                break;
            case 'o':
            case 'O':
                toggleOverview(true);
                break;
            case 't':
            case 'T':
                toggleTheme();
                break;
            case 'c':
            case 'C':
                toggleCommentModal(true);
                break;
        }
    });

    let touchStartX = 0;
    let touchEndX = 0;

    document.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    document.addEventListener('touchend', (e) => {
        touchEndX = e.changedTouches[0].screenX;
        handleSwipe();
    }, { passive: true });

    function handleSwipe() {
        const diff = touchEndX - touchStartX;
        if (Math.abs(diff) > 50) {
            if (diff < 0) {
                nextSlide();
            } else {
                prevSlide();
            }
        }
    }

    initOverview();
    goToSlide(getSlideFromHash());

    window.addEventListener('hashchange', () => {
        goToSlide(getSlideFromHash());
    });

    // Automatyczne odświeżanie przeglądarki (Live Reload) tylko na lokalnym serwerze (localhost / 127.0.0.1)
    (function setupLiveReload() {
        const isLocalHost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        if (!isLocalHost) return;

        let initialTimestamp = null;
        const initialMatch = document.documentElement.outerHTML.match(/<!-- BUILD_TIMESTAMP:\s*(\d+(\.\d+)?) -->/);
        if (initialMatch) {
            initialTimestamp = initialMatch[1];
        }

        setInterval(() => {
            fetch(window.location.href, { cache: 'no-store' })
                .then(res => res.text())
                .then(html => {
                    const newMatch = html.match(/<!-- BUILD_TIMESTAMP:\s*(\d+(\.\d+)?) -->/);
                    if (newMatch && initialTimestamp && newMatch[1] !== initialTimestamp) {
                        console.log('[LiveReload] Wykryto nową kompilację prezentacji. Odświeżam stronę...');
                        window.location.reload();
                    }
                })
                .catch(() => {});
        }, 1500);
    })();
});


    </script>
