<div class="controls-bar">
    <button class="ctrl-btn" id="prevBtn" title="Poprzedni slajd (←)">
        <i class="fa-solid fa-chevron-left"></i>
    </button>
    <div class="slide-counter" id="slideCounter">1 / 14</div>
    <button class="ctrl-btn" id="nextBtn" title="Następny slajd (→ / Spacja)">
        <i class="fa-solid fa-chevron-right"></i>
    </button>
    
    <div class="divider"></div>

    <button class="ctrl-btn" id="themeToggleBtn" title="Przełącz motyw Jasny/Ciemny (T)">
        <i class="fa-solid fa-sun" id="themeIcon"></i>
    </button>
    <button class="ctrl-btn" id="overviewBtn" title="Przegląd slajdów (O)">
        <i class="fa-solid fa-grip"></i>
    </button>
    <button class="ctrl-btn" id="pinBtn" title="Postaw pinezkę z komentarzem (P)">
        <i class="fa-solid fa-location-dot"></i>
    </button>
    <button class="ctrl-btn" id="allCommentsBtn" title="Lista wszystkich uwag (L)">
        <i class="fa-solid fa-list-check"></i>
        <span class="btn-badge" id="allCommentsBadge" style="display: none;">0</span>
    </button>
    <button class="ctrl-btn" id="fullscreenBtn" title="Pełny ekran (F)">
        <i class="fa-solid fa-expand"></i>
    </button>
</div>
