<!-- Baner Informacyjny Trybu Komentarzy -->
<div class="pin-mode-banner" id="pinModeBanner" style="display: none;">
    <div class="pin-banner-content">
        <i class="fa-solid fa-location-dot pulse-icon"></i>
        <span><strong>TRYB KOMENTARZY WŁĄCZONY:</strong> Kliknij w dowolne miejsce na slajdzie, aby dodać komentarz.</span>
        <button class="pin-banner-btn" id="bannerShowDrawerBtn" title="Zobacz wszystkie komentarze">
            <i class="fa-solid fa-list-check"></i> Lista komentarzy (<span class="banner-pins-count">0</span>)
        </button>
        <button class="pin-banner-close" id="closePinModeBtn" title="Zamknij tryb komentarzy (Esc / P)">
            <i class="fa-solid fa-xmark"></i> Wyjdź (P / Esc)
        </button>
    </div>
</div>

<!-- Modal Dodawania nowej Pinezki -->
<div class="pin-modal-overlay" id="pinModalOverlay" style="display: none;">
    <div class="pin-modal-card">
        <div class="pin-modal-header">
            <h3><i class="fa-solid fa-location-dot"></i> Nowy komentarz na slajdzie</h3>
            <span class="slide-badge" id="pinSlideBadge">Slajd #1</span>
        </div>
        <form id="pinForm" class="pin-form">
            <input type="hidden" id="pinXInput" name="x" />
            <input type="hidden" id="pinYInput" name="y" />
            <input type="hidden" id="pinSlideInput" name="slide" />

            <div class="form-group">
                <label for="pinAuthor">Twoje imię lub e-mail (opcjonalnie):</label>
                <input type="text" id="pinAuthor" name="author" placeholder="np. Anna / anna@firma.pl" autocomplete="off" />
            </div>

            <div class="form-group">
                <label for="pinComment">Treść komentarza w tym miejscu:</label>
                <textarea id="pinComment" name="comment" rows="3" placeholder="Wpisz treść komentarza..." required></textarea>
            </div>

            <div class="pin-modal-actions">
                <button type="button" class="btn-cancel" id="cancelPinBtn">Anuluj</button>
                <button type="submit" class="submit-pin-btn" id="submitPinBtn">Dodaj komentarz</button>
            </div>
        </form>
    </div>
</div>

<!-- Boczny Wysuwany Panel Wszystkich Komentarzy (Comments Side Drawer) -->
<div class="comments-drawer-overlay" id="drawerOverlay" style="display: none;"></div>
<div class="comments-drawer" id="commentsDrawer">
    <div class="drawer-header">
        <div class="drawer-title">
            <i class="fa-solid fa-list-check"></i>
            <h3>Wszystkie komentarze</h3>
            <span class="drawer-counter-badge" id="drawerCount">0</span>
        </div>
        <button class="drawer-close-btn" id="closeDrawerBtn" title="Zamknij panel (Esc)">
            <i class="fa-solid fa-xmark"></i>
        </button>
    </div>

    <div class="drawer-content" id="drawerList">
        <!-- Lista kart komentarzy renderowana dynamicznie -->
        <div class="drawer-empty-state">
            <i class="fa-solid fa-comments"></i>
            <p>Brak dodanych komentarzy na slajdach.</p>
        </div>
    </div>
</div>
