<div class="comment-overlay" id="commentOverlay">
    <div class="comment-modal">
        <div class="comment-header">
            <div class="comment-title-group">
                <h2><i class="fa-solid fa-comment-dots"></i> Dodaj uwagę do slajdu</h2>
                <span class="slide-badge" id="commentSlideBadge">Slajd #1</span>
            </div>
            <button class="close-comment" id="closeCommentBtn" title="Zamknij (Esc)">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <form name="presentation-comments" method="POST" netlify data-netlify="true" action="/" id="commentForm" class="comment-form">
            <input type="hidden" name="form-name" value="presentation-comments" />
            <input type="hidden" name="slide_number" id="commentSlideInput" value="1" />
            <input type="hidden" name="slide_title" id="commentSlideTitleInput" value="" />

            <div class="form-group">
                <label for="commentAuthor">Twoje imię lub e-mail (opcjonalnie):</label>
                <input type="text" id="commentAuthor" name="author" placeholder="np. Jan / jan@firma.pl" autocomplete="off" />
            </div>

            <div class="form-group">
                <label for="commentText">Treść uwagi / komentarza:</label>
                <textarea id="commentText" name="comment" rows="4" placeholder="Wpisz tutaj uwagę do tego slajdu..." required></textarea>
            </div>

            <div class="comment-actions">
                <button type="button" class="btn-cancel" id="cancelCommentBtn">Anuluj</button>
                <button type="submit" class="submit-comment-btn" id="submitCommentBtn">
                    <i class="fa-solid fa-paper-plane"></i> Wyślij uwagę
                </button>
            </div>
        </form>

        <div class="comment-success-msg" id="commentSuccessMsg" style="display: none;">
            <i class="fa-solid fa-circle-check success-icon"></i>
            <h3>Dziękujemy za uwagę!</h3>
            <p>Komentarz do <strong id="successSlideRef">Slajdu #1</strong> został pomyślnie wysłany.</p>
            <button type="button" class="submit-comment-btn" id="closeSuccessBtn">Wróć do prezentacji</button>
        </div>
    </div>
</div>
